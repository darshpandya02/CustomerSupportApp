[project]
name = "customer-support-app"
version = "1.0.0"
description = "Customer support assistant: RAG over the Nextcloud user manual with a Llama model, plus a FastAPI ticketing backend"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115",
    "numpy>=1.26,<3",
    "faiss-cpu>=1.9",
    "onnxruntime>=1.19",
    "tokenizers>=0.20",
    "httpx>=0.27",
    "psycopg[binary]>=3.2",
    "psycopg-pool>=3.2",
]

[dependency-groups]
dev = ["pytest>=8", "uvicorn>=0.30"]
build = [
    "requests>=2.32",
    "beautifulsoup4>=4.12",
    "sentence-transformers>=3.0",
    "onnx>=1.16",
    "optimum[onnxruntime]>=1.21",
    "scikit-learn>=1.5",
]

[tool.uv]
package = false
default-groups = []

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
